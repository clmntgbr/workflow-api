# Production-oriented compose (API + worker + executor + scheduler).
# Expects managed/external Postgres and RabbitMQ via .env.
# For local infra: use compose.dev.yaml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api
    command: ["./api"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: worker
    command: ["./worker"]
    env_file:
      - .env
    restart: unless-stopped

  executor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: executor
    command: ["./executor"]
    env_file:
      - .env
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: scheduler
    command: ["./scheduler"]
    env_file:
      - .env
    restart: unless-stopped
