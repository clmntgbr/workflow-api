# Codecov configuration for workflow-api
# Docs: https://docs.codecov.com/docs/codecovyml-reference

coverage:
  precision: 1
  round: down
  range: "70...100"

  status:
    project:
      default: off
      handler:
        target: 95%
        threshold: 0.5%
        flags:
          - handler
        if_ci_failed: error
    patch:
      handler:
        target: 100%
        threshold: 0%
        flags:
          - handler
        if_ci_failed: error

flags:
  handler:
    paths:
      - internal/interfaces/http/handler/

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
