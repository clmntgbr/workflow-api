{{define "content"}}
<h1 style="margin:0 0 16px 0; font-size:20px; font-weight:600; color:#991b1b;">Quota exceeded</h1>
<p style="margin:0 0 12px 0;">
  An action was blocked because you reached your <strong>{{.QuotaLabel}}</strong> limit
  ({{.Used}} / {{.Max}}). Upgrade your plan to continue.
</p>
{{if .BillingURL}}
<p style="margin:0;">
  <a href="{{.BillingURL}}" style="display:inline-block; padding:12px 20px; background-color:#1a1a1a; color:#ffffff; text-decoration:none; border-radius:6px; font-size:14px; font-weight:600;">
    Upgrade plan
  </a>
</p>
{{end}}
{{end}}
