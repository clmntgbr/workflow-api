{{define "layout"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif;">
  <!-- Preheader: hidden text shown in inbox preview -->
  <div style="display:none; max-height:0; overflow:hidden;">{{.Preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;">
    <tr>
      <td align="center" style="padding:24px 16px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding:32px 24px 16px 24px;">
              {{if .LogoURL}}
              <img src="{{.LogoURL}}" alt="FlowForge" width="140" style="display:block;">
              {{else}}
              <span style="display:inline-block; font-size:20px; font-weight:700; color:#1a1a1a; letter-spacing:0.02em;">FlowForge</span>
              {{end}}
            </td>
          </tr>

          <!-- Email-specific content -->
          <tr>
            <td style="padding:0 32px 32px 32px; color:#1a1a1a; font-size:15px; line-height:1.5;">
              {{template "content" .}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px; background-color:#f9f9fb; border-top:1px solid #eaeaea; font-size:12px; color:#8a8a8a; text-align:center;">
              <p style="margin:0 0 8px 0;">{{if .CompanyAddress}}FlowForge — {{.CompanyAddress}}{{else}}FlowForge{{end}}</p>
              {{if .PreferencesURL}}
              <p style="margin:0;">
                <a href="{{.PreferencesURL}}" style="color:#8a8a8a; text-decoration:underline;">Gérer mes préférences de notification</a>
              </p>
              {{end}}
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
{{end}}
